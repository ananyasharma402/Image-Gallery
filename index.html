<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Interactive Image Gallery</h1>

    <!-- Image Gallery -->
    <div class="gallery">

        <img src="https://picsum.photos/id/1015/400/300" alt="Image 1">

        <img src="https://picsum.photos/id/1016/400/300" alt="Image 2">

        <img src="https://picsum.photos/id/1025/400/300" alt="Image 3">

        <img src="https://picsum.photos/id/1035/400/300" alt="Image 4">

        <img src="https://picsum.photos/id/1040/400/300" alt="Image 5">

        <img src="https://picsum.photos/id/1069/400/300" alt="Image 6">

        <img src="https://picsum.photos/id/1074/400/300" alt="Image 7">

        <img src="https://picsum.photos/id/1084/400/300" alt="Image 8">

    </div>


    <!-- Lightbox -->
    <div class="lightbox">

        <span class="close">&times;</span>

        <img class="lightbox-img" src="" alt="Large Image">

    </div>


    <script src="script.js"></script>

</body>
</html>
